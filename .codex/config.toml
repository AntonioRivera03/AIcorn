[mcp_servers.aycorn]
command = "/home/hal/Projects/AIcorn/server/bin/aycorn-mcp"

[mcp_servers.aycorn.env]
AYCORN_DB = "/home/hal/.config/aycorn/app.db"

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.conductor]
description = "Aycorn conductor; ticket lifecycle belongs to Conductor"
config_file = "../server/internal/harness/fleet/conductor.toml"

[agents.planner]
description = "Aycorn planner; ticket lifecycle belongs to Conductor"
config_file = "../server/internal/harness/fleet/planner.toml"

[agents.researcher]
description = "Aycorn researcher; ticket lifecycle belongs to Conductor"
config_file = "../server/internal/harness/fleet/researcher.toml"

[agents.coder]
description = "Aycorn coder; ticket lifecycle belongs to Conductor"
config_file = "../server/internal/harness/fleet/coder.toml"

[agents.reviewer]
description = "Aycorn reviewer; ticket lifecycle belongs to Conductor"
config_file = "../server/internal/harness/fleet/reviewer.toml"

[agents.chatter]
description = "Aycorn project conversation and task coordination"
config_file = "../server/internal/harness/fleet/chatter.toml"
